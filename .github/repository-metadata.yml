# What this repository says about itself, in one place.
#
# This is a record, not a contract: no script reads it and no CI job enforces it.
# It exists so that the next person, or the next agent, changing the repository
# description, the topics, the README opening or the Pages <head> has one file to read
# instead of reverse-engineering the intent from several places that drift apart.
#
# When you change a fact here, change it in the places listed under `appears_in` too.

schema_version: 1
repository: AlveeeRahman/mr-usage
name: Mr. Usage

canonical_url: https://alveeerahman.github.io/mr-usage/
sitemap_url: https://alveeerahman.github.io/mr-usage/sitemap.xml

# One precise phrase. It belongs in the title, the opening paragraph, one heading and
# the repository description, once each, not repeated for its own sake.
primary_keyword: "desktop API credit monitor"

title: "Mr. Usage: a desktop API credit monitor"
description: "A desktop API credit monitor: check the remaining credits and balance of your Firecrawl, SerpApi, Elicit, Context7, Tavily, OpenRouter, Apify, Hunter and Runway keys in one window. Keys stay in your OS keychain. No server, no telemetry."

# GitHub's About box takes at most 350 characters; this is the same text, shortened.
about: "Desktop API credit monitor: see the remaining credits and balance of your Firecrawl, SerpApi, Elicit, Context7, Tavily, OpenRouter, Apify, Hunter and Runway keys in one window. Keys stay in your OS keychain. No server, no telemetry."

version: "0.1.0"
license_spdx: MIT OR Apache-2.0
programming_language: Rust          # backend and core; the window is TypeScript on Tauri 2
runtime_platform: macOS, Windows and Linux desktops (Tauri 2 webview)
author:
  name: Alvee Rahman
  url: https://github.com/AlveeeRahman

# Facts that the README, the Pages <head> and the release notes repeat.
providers: [Firecrawl, SerpApi, Elicit, Context7, Tavily, OpenRouter, Apify, Hunter, Runway]
tauri: "2.12.4"
key_storage: macOS Keychain, Windows Credential Manager, Linux Secret Service (service name "mr-usage")
history: in memory only, wiped at local midnight and on exit

# Every network connection the software opens. Nothing else is contacted: no update
# check, no telemetry. reqwest honours HTTPS_PROXY if the user sets it.
network_surfaces:
  - component: crates/core/src/providers/firecrawl.rs
    hosts: [api.firecrawl.dev]
    purpose: GET /v2/team/credit-usage with the user's key (free; read from Firecrawl's open-source API server).
  - component: crates/core/src/providers/serpapi.rs
    hosts: [serpapi.com]
    purpose: GET /account.json with the user's key (free, not counted against searches).
  - component: crates/core/src/providers/elicit.rs
    hosts: [elicit.com]
    purpose: GET /api/v2/usage with the user's key.
  - component: crates/core/src/providers/context7.rs
    hosts: [context7.com]
    purpose: GET /api/v2/usage?days=1 with the user's key (documented as not counting as a request).
  - component: crates/core/src/providers/tavily.rs
    hosts: [api.tavily.com]
    purpose: GET /usage with the user's key.
  - component: crates/core/src/providers/openrouter.rs
    hosts: [openrouter.ai]
    purpose: GET /api/v1/key with the user's key.
  - component: crates/core/src/providers/apify.rs
    hosts: [api.apify.com]
    purpose: GET /v2/users/me/limits with the user's token.
  - component: crates/core/src/providers/hunter.rs
    hosts: [api.hunter.io]
    purpose: GET /v2/account with the user's key (documented as free).
  - component: crates/core/src/providers/runway.rs
    hosts: [api.dev.runwayml.com]
    purpose: GET /v1/organization with the user's key and the X-Runway-Version header.
  - component: installers/install.sh, installers/install.ps1 (run by the user, not by the app)
    hosts: [api.github.com, github.com, objects.githubusercontent.com]
    purpose: read the latest release and download the package and SHA256SUMS.txt.

# GitHub allows 20. Lowercase words separated by hyphens, describing what the software
# is rather than how good it is.
topics:
  - api-usage
  - usage-monitor
  - api-credits
  - firecrawl
  - serpapi
  - elicit
  - context7
  - tavily
  - openrouter
  - apify
  - tauri
  - rust
  - typescript
  - desktop-app
  - macos
  - windows
  - linux
  - keychain
  - privacy
  - security

# 1280x640, the size GitHub asks for. docs/assets/social-preview.html is the editable
# source; .github/scripts/render-social-preview.mjs renders it. Upload it by hand in
# Settings > General > Social preview (GitHub has no API for this).
social_preview: docs/assets/social-preview.png

suite:
  - name: LLM Dogfight
    url: https://alveeerahman.github.io/llm-dogfight/
  - name: Skill Vision
    url: https://alveeerahman.github.io/skill-vision/
  - name: Agent Oracle
    url: https://alveeerahman.github.io/agent-oracle/
  - name: Research Hound
    url: https://alveeerahman.github.io/research-hound/

# The Pages site is published by .github/workflows/pages.yml from docs/ on every
# push to main, once Settings > Pages has Source set to "GitHub Actions". Besides the
# index, .github/scripts/render-provider-pages.py writes one page per provider
# under docs/providers/ and the sitemap, so searches such as "check my
# OpenRouter balance" have a page that answers them with the exact endpoint.
pages:
  workflow: .github/workflows/pages.yml
  provider_pages: .github/scripts/render-provider-pages.py

# The files that repeat the facts above. Keep them in step by hand.
appears_in:
  - README.md (opening lines and the provider table)
  - docs/DEVELOPMENT.md
  - src-tauri/Cargo.toml (description, homepage, keywords, categories)
  - package.json (description, homepage, keywords)
  - docs/index.html
  - docs/providers/*.html (generated; edit the script)
  - docs/sitemap.xml (generated)
  - github.com repository description, homepage and topics
