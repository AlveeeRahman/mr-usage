  - usage-monitor
  - api-credits
  - firecrawl
  - serpapi
  - elicit
  - context7
  - tavily
  - openrouter
  - apify
  - tauri
  - rust
  - typescript
  - desktop-app
  - macos
  - windows
  - linux
  - keychain
  - privacy
  - security

# 1280x640, the size GitHub asks for. docs/assets/social-preview.html is the editable
# source; .github/scripts/render-social-preview.mjs renders it. Upload it by hand in
# Settings > General > Social preview (GitHub has no API for this).
social_preview: docs/assets/social-preview.png

suite:
  - name: LLM Dogfight
    url: https://alveeerahman.github.io/llm-dogfight/
  - name: Skill Vision
    url: https://alveeerahman.github.io/skill-vision/
  - name: Agent Oracle
    url: https://alveeerahman.github.io/agent-oracle/
  - name: Research Hound
    url: https://alveeerahman.github.io/research-hound/

# The Pages site is published by .github/workflows/pages.yml from docs/ on every
# push to main, once Settings > Pages has Source set to "GitHub Actions". Besides the
# index, .github/scripts/render-provider-pages.py writes one page per provider
# under docs/providers/ and the sitemap, so searches such as "check my
# OpenRouter balance" have a page that answers them with the exact endpoint.
pages:
  workflow: .github/workflows/pages.yml
  provider_pages: .github/scripts/render-provider-pages.py

# The files that repeat the facts above. Keep them in step by hand.
appears_in:
  - README.md (opening lines and the provider table)
  - docs/DEVELOPMENT.md
  - src-tauri/Cargo.toml (description, homepage, keywords, categories)
  - package.json (description, homepage, keywords)
  - docs/index.html
  - docs/providers/*.html (generated; edit the script)
  - docs/sitemap.xml (generated)
  - github.com repository description, homepage and topics
