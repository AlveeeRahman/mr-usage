name: scorecard

# OpenSSF Scorecard: an automated review of the repository's security
# practices (pinned dependencies, token permissions, SAST, branch rules,
# signed releases and so on), scored out of 10. Results go to the Security
# tab as code-scanning alerts and, with publish_results, to the public
# Scorecard API that backs the README badge:
# https://scorecard.dev/viewer/?uri=github.com/AlveeeRahman/mr-usage
#
# Mirrors the maintainers' own workflow,
# https://github.com/ossf/scorecard/blob/main/.github/workflows/scorecard-analysis.yml,
# and keeps to the restrictions the Scorecard API enforces on a publishing
# workflow: no top-level env or defaults, read-only workflow permissions,
# id-token: write only on this job, an Ubuntu runner, and only the approved
# actions as steps (https://github.com/ossf/scorecard-action#workflow-restrictions).
on:
  push:
    branches: [main] # only the default branch is supported
  schedule:
    - cron: "30 1 * * 6" # weekly, so a change in the checks is picked up without a push

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # upload to code scanning
      id-token: write # OIDC token that authenticates the published result
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      # The SARIF file stays downloadable for five days, so anyone can read
      # the full findings, not just people with write access.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
