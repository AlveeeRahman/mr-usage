name: release

# Three ways in:
#
# 1. Push a tag such as v0.1.0. Installers for macOS (Apple silicon and Intel),
#    Linux and Windows are built and attached, with SHA-256 sums, to a DRAFT
#    release. Then `verify-install` installs that draft on a fresh runner of
#    each OS through the user-facing scripts (`installers/install.sh --version`,
#    `installers/install.ps1 -Version`) and uninstalls it again. Review the
#    draft and publish it by hand; nothing is public until you do.
#
# 2. Run the workflow by hand (workflow_dispatch) with a `tag` such as v0.1.0.
#    Same pipeline, same draft, for when a tag cannot be pushed from where you
#    are. GitHub creates the git tag at the moment you publish the draft, so
#    it points at the commit the draft was built from.
#
# 3. Run the workflow by hand with the `tag` field empty. The pipeline runs
#    against a throwaway draft named v0.0.0-ci.<run number>, marked
#    pre-release, and the last job deletes that draft. This is the delivery
#    rehearsal: it proves the build, the checksum list, the download path and
#    the install scripts end to end without publishing anything.
#
# Workflow shape follows https://v2.tauri.app/distribute/pipelines/github/.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, such as v0.1.0. Leave empty for a rehearsal that deletes its draft."
        required: false
        default: ""

permissions:
  contents: read

env:
  # A pushed tag or a dispatched `tag` is the release; a manual run with no tag
  # gets a disposable draft.
  TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag || format('v0.0.0-ci.{0}', github.run_number) }}
  REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '' }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag name
        shell: bash
        run: |
          case "$TAG" in
            v[0-9]*) echo "building $TAG" ;;
            *) echo "::error::the tag must look like v0.1.0, got '$TAG'"; exit 1 ;;
          esac
      - if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev rpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: "Mr. Usage ${{ env.TAG }}"
          releaseBody: "Install with the one-line command in the README; it picks the right file and verifies it against SHA256SUMS.txt for you. Builds are not code-signed yet."
          releaseDraft: true
          prerelease: ${{ env.REHEARSAL == 'true' }}
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  checksums:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish SHA-256 sums for every release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*'
          rm -f SHA256SUMS.txt
          sha256sum -- * | tee SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

  # The path a user takes, on a machine that has never seen the app. The
  # scripts read the draft through the repository token (a draft is invisible
  # without one), download the package and SHA256SUMS.txt, verify, install,
  # then uninstall through the same script.
  verify-install:
    needs: checksums
    permissions:
      contents: write # reading a draft release needs push rights on the repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update && sudo apt-get install -y gnome-keyring
          sh installers/install.sh --version "$TAG"
          test -x /usr/bin/mr-usage
          /usr/bin/mr-usage --forget-keys || true
          sh installers/install.sh --uninstall
          ! test -e /usr/bin/mr-usage
      - if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sh installers/install.sh --version "$TAG"
          test -x "/Applications/Mr. Usage.app/Contents/MacOS/mr-usage"
          if xattr -p com.apple.quarantine "/Applications/Mr. Usage.app" 2>/dev/null; then echo "quarantine flag still set"; exit 1; fi
          sh installers/install.sh --uninstall
          ! test -e "/Applications/Mr. Usage.app"
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./installers/install.ps1 -Version $env:TAG
          if (-not (Get-ChildItem -Path $env:LOCALAPPDATA -Filter mr-usage.exe -Recurse -Depth 2)) { throw 'not installed' }
          ./installers/install.ps1 -Uninstall
          if (Get-ChildItem -Path $env:LOCALAPPDATA -Filter mr-usage.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue) { throw 'still installed' }

  # A rehearsal leaves nothing behind. (A draft has no git tag, so there is
  # nothing else to remove.) A real release's draft stays for review.
  cleanup-rehearsal:
    if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '' && needs.build.result != 'skipped'
    needs: [build, checksums, verify-install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || echo "no draft to delete"
