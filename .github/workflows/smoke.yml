name: install-smoke

# Builds the real installers on each OS, then installs, starts, stops (several
# ways) and uninstalls them. See scripts/smoke-*.{sh,ps1} for every check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev \
            rpm xvfb openbox wmctrl xdotool gnome-keyring dbus-x11 file
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci
      - run: npm run tauri -- build --bundles deb,rpm,appimage
      - name: Smoke test .deb
        run: bash scripts/smoke-linux.sh deb target/release/bundle/deb/*.deb
      - name: Smoke test AppImage
        run: |
          cp target/release/bundle/appimage/*.AppImage "$RUNNER_TEMP/mr-usage.AppImage"
          bash scripts/smoke-linux.sh appimage "$RUNNER_TEMP/mr-usage.AppImage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-rpm
          path: target/release/bundle/rpm/*.rpm

  fedora-rpm:
    needs: linux
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-rpm
          path: rpm
      - run: dnf install -y xorg-x11-server-Xvfb openbox wmctrl xdotool dbus-x11 dbus-daemon gnome-keyring procps-ng findutils
      - run: bash scripts/smoke-linux.sh rpm rpm/*.rpm

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci
      - run: npm run tauri -- build --bundles app,dmg
      - run: bash scripts/smoke-macos.sh target/release/bundle/dmg/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci
      - run: npm run tauri -- build --bundles nsis,msi
      - name: Smoke test NSIS installer
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -Kind nsis -Installer (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
      - name: Smoke test MSI installer
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -Kind msi -Installer (Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1).FullName
