[workspace]
resolver = "3"
members = ["crates/core", "src-tauri"]
# The fuzz crate needs nightly and libFuzzer, so it keeps its own lockfile and
# is built only by `cargo fuzz` (docs/DEVELOPMENT.md).
exclude = ["fuzz"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlveeeRahman/mr-usage"

# Versions read from the crates.io index and docs.rs on 2026-10-16. See docs/SOURCES.md.
[workspace.dependencies]
async-trait = "=0.1.92"
base64 = "=0.23.1"
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo", "tzdb-concatenated"] }
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
libc = "=0.2.191"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = { version = "=0.10.3", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.4", features = [] }
tauri-build = { version = "=2.7.4", features = [] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
zeroize = { version = "=1.9.1", features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true
