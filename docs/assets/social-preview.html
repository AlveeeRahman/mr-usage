<!doctype html>
<!--
  Source for docs/assets/social-preview.png (1280x640, the size GitHub asks for).
  Re-render after changing the screenshot or the wording:
    node scripts/render-social-preview.mjs
  Then upload the PNG in GitHub: Settings > General > Social preview.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #1a1a19;
    color: #f0efec;
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", "Cantarell", "Noto Sans", sans-serif;
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 48px;
    padding: 64px 72px 0;
    box-sizing: border-box;
  }
  h1 { margin: 0 0 18px; font-size: 76px; font-weight: 700; letter-spacing: -0.02em; }
  .tag { margin: 0 0 36px; font-size: 32px; line-height: 1.3; color: #c3c2b7; max-width: 640px; }
  ul { margin: 0; padding: 0; list-style: none; font-size: 24px; color: #f0efec; }
  li { margin: 0 0 14px; padding-left: 28px; position: relative; }
  li::before { content: ""; position: absolute; left: 0; top: 13px; width: 14px; height: 6px; border-radius: 3px; background: #3987e5; }
  .shot { align-self: end; border: 1px solid #383835; border-bottom: 0; border-radius: 14px 14px 0 0; overflow: hidden; height: 560px; }
  .shot img { width: 420px; display: block; }
  .foot { position: absolute; left: 72px; bottom: 44px; font-size: 20px; color: #a3a29a; }
</style>
</head>
<body>
  <div>
    <h1>Mr. Usage</h1>
    <p class="tag">See how many Firecrawl, SerpApi and Elicit credits you have left, in one desktop window.</p>
    <ul>
      <li>Keys stay in your OS keychain</li>
      <li>No server, no account, no telemetry</li>
      <li>macOS, Windows and Linux</li>
    </ul>
  </div>
  <div class="shot"><img src="screenshot-dark.png" alt=""></div>
  <div class="foot">github.com/AlveeeRahman/mr-usage &middot; open source (MIT or Apache-2.0)</div>
</body>
</html>
