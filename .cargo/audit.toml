# cargo-audit runs in CI with `-D warnings`, so any advisory (vulnerability,
# unmaintained, unsound, yanked) fails the build unless it is listed here with
# a reason. Both entries come from gtk-rs 0.18, which Tauri 2 uses for its
# Linux webview; neither is reachable from Mr. Usage's own code and neither has
# an upgrade path until Tauri leaves GTK3. Tracked in docs/FOLLOWUPS.md.
[advisories]
ignore = [
  "RUSTSEC-2024-0370", # proc-macro-error unmaintained: compile-time only (glib-macros, gtk3-macros)
  "RUSTSEC-2024-0429", # glib::VariantStrIter unsound: Mr. Usage never calls GVariant APIs
]
